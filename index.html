<script>
function openImageZoom(src){const layer=document.getElementById('imageZoom');document.getElementById('imageZoomImg').src=src;layer.hidden=false;document.body.style.overflow='hidden';const scroll=document.getElementById('imageZoomScroll');scroll.scrollLeft=0;scroll.scrollTop=0}
function closeImageZoom(){document.getElementById('imageZoom').hidden=true;document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeImageZoom()});
const DATA=window.COMPLETE_QUESTIONS,EX=window.EXPLANATIONS,CHOICE_EX=window.CHOICE_EXPLANATIONS,KEY='khistory80_mvp_v1';const sym=['','①','②','③','④','⑤'];let state;try{state=JSON.parse(localStorage.getItem(KEY))||{attempts:{},bookmarks:[]}}catch{state={attempts:{},bookmarks:[]}}state.attempts??={};state.bookmarks??=[];let idx=1,choice=0,screen='quiz',replay=false;const el=x=>document.getElementById(x);const latest=n=>(state.attempts[n]||[]).at(-1);const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function resetProgress(){
 const count=Object.values(state.attempts).filter(a=>Array.isArray(a)&&a.length).length;
 if(!count){window.alert('초기화할 풀이 기록이 없습니다.');return;}
 if(!window.confirm(`풀이 기록 ${count}문항을 초기화하시겠습니까?\n점수, 정답률, 오답노트가 삭제됩니다. 북마크는 유지됩니다.\n이 작업은 되돌릴 수 없습니다.`))return;
 state.attempts={};save();idx=1;choice=0;replay=false;view('home');
}
function nextUnsolved(){return DATA.find(q=>!latest(q.question_number))?.question_number||1}
function view(name){screen=name;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===name));draw();window.scrollTo(0,0)}
function moveTo(n){idx=Math.max(1,Math.min(50,n));choice=0;replay=false;view('quiz')}
function step(d){moveTo(idx+d)}
function select(n){if(latest(idx)&&!replay)return;choice=n;drawQuiz(false)}
function submit(){if(!choice)return;const q=DATA[idx-1];state.attempts[idx]??=[];state.attempts[idx].push({option:choice,correct:choice===q.correct_option,correct_option:q.correct_option,at:new Date().toISOString()});replay=false;save();drawQuiz(false)}
function retry(n){idx=n;choice=0;replay=true;view('quiz')}
function bookmark(){const i=state.bookmarks.indexOf(idx);if(i>=0)state.bookmarks.splice(i,1);else state.bookmarks.push(idx);save();draw()}
function removeBookmark(n){state.bookmarks=state.bookmarks.filter(x=>Number(x)!==n);save();draw();}
function drawBookmarks(){
 const ids=[...new Set(state.bookmarks.map(Number))].filter(n=>Number.isInteger(n)&&n>=1&&n<=DATA.length).sort((a,b)=>a-b);
 el('bookmarkCount').textContent=`저장한 문제 ${ids.length}개 · 문제를 누르면 바로 이동합니다.`;
 el('homeBookCount').textContent=`(${ids.length})`;
 el('bookmarklist').innerHTML=ids.length?ids.map(n=>{
  const q=DATA[n-1],a=latest(n);
  const status=a?(a.correct?'정답':'오답'):'미풀이';
  return `<div class="bookmark-card"><div class="bookmark-card-content"><div class="bookmark-card-title">★ ${n}번 · ${q.points}점 · ${status}</div><div class="bookmark-card-sub">${escape(q.question_text)}</div></div><button class="outline" onclick="moveTo(${n})">문제 보기</button><button class="bookmark-remove" aria-label="${n}번 북마크 해제" onclick="removeBookmark(${n})">해제</button></div>`;
 }).join(''):'<div class="bookmark-empty">아직 저장한 문제가 없습니다.<br>문제를 풀다가 ☆ 북마크를 눌러 저장해 보세요.</div>';
}
function drawQuiz(resetScroll){
 const q=DATA[idx-1],a=replay?null:latest(idx),submitted=!!a;
 el('qlabel').textContent=`한국사능력검정시험 · 심화 제80회 · ${idx}번 (${q.points}점)`;
 el('stembox').innerHTML=`<h2 class="question-text">${escape(q.question_text)}</h2><div class="stemwrap"><img src="${q.material_image}" alt="${idx}번 문제의 사료와 그림" onclick="openImageZoom(this.src)" title="자료 확대" /></div>`;
 el('choices').innerHTML=q.options.map(o=>{
   const isPicked=submitted?a.option===o.number:choice===o.number;
   const isCorrect=submitted&&o.number===q.correct_option;
   const isWrong=submitted&&isPicked&&!a.correct;
   const cls=submitted?(isCorrect?'correct':isWrong?'incorrect':''):(isPicked?'selected':'');
   const isPhoto=!!o.image;
   const label=submitted?(isPicked?'<span class="answer-tag mine">내가 선택한 답</span>':'')+(isCorrect?'<span class="answer-tag right-tag">정답</span>':''):'';
   const why=submitted?`<div class="choice-explanation"><strong class="explanation-heading">해설 - </strong>${escape((CHOICE_EX[idx]||[])[o.number-1]||'해설을 검토하고 있습니다.')}</div>`:'';
   return `<div class="option-unit ${cls} ${isPhoto?'photo-option':''}"><button class="choice ${cls}" ${submitted?'disabled':''} onclick="select(${o.number})" aria-label="${o.number}번 보기">${isPhoto?'':`<span class="bubble">${sym[o.number]}</span>`}<span class="ctxt">${o.image?`<img class="choiceimg" src="${o.image}" alt="${o.number}번 문화유산 보기">`:escape(o.text)}</span></button>${label?`<div class="answer-tags">${label}</div>`:''}${why}</div>`;
 }).join('');
 el('fb').innerHTML=submitted?`<div class="feedback ${a.correct?'':'bad'}"><b>${a.correct?'✓ 정답입니다.':'오답입니다. 정답은 '+sym[q.correct_option]+'번입니다.'}</b></div>`:'';
 el('submitrow').innerHTML=submitted?`<button class="primary" onclick="step(1)" ${idx===50?'disabled':''}>다음 문제 →</button><button class="outline" onclick="retry(${idx})">다시 풀기</button>`:`<button class="primary" onclick="submit()" ${choice?'':'disabled'}>정답 제출</button>`;
 el('exbox').innerHTML=submitted?`<section class="solution"><div class="solution-title">핵심 정리 <span>자체 작성 학습 해설</span></div><div class="solution-summary">${escape(EX[idx]||'핵심 해설 검토 중')}</div></section>`:'';
 el('bookmark').innerText=state.bookmarks.includes(idx)?'★ 북마크':'☆ 북마크';
 el('headcount').innerText=`문제 ${idx} / 50`;el('bar').style.width=(idx*2)+'%';
 el('prev').disabled=idx===1;el('next').disabled=idx===50;
 if(resetScroll)window.scrollTo(0,0);
}
function draw(){if(screen==='quiz')drawQuiz(false);drawBookmarks();let done=DATA.filter(q=>latest(q.question_number)),wrong=done.filter(q=>!latest(q.question_number).correct),score=done.reduce((v,q)=>v+(latest(q.question_number).correct?q.points:0),0);el('hDone').textContent=`${done.length}/50`;el('hScore').textContent=`${score}점`;el('hWrong').textContent=`${wrong.length}개`;el('wronglist').innerHTML=wrong.length?wrong.map(q=>`<div class="item"><div><b>${q.question_number}번</b> <span class="muted">${q.points}점 · 선택 ${sym[latest(q.question_number).option]} / 정답 ${sym[q.correct_option]}</span></div><button class="outline" onclick="retry(${q.question_number})">다시 풀기</button></div>`).join(''):'틀린 문제가 없습니다.';el('analysistxt').innerHTML=`<div class="statline"><div class="stat"><span class="muted">완료</span><b>${done.length}/50</b></div><div class="stat"><span class="muted">정답률</span><b>${done.length?Math.round((done.length-wrong.length)/done.length*100):0}%</b></div><div class="stat"><span class="muted">현재 점수</span><b>${score} / 100</b></div></div><p class="muted" style="margin-top:20px">미풀이 문항은 0점으로 처리합니다. 정답률은 마지막 풀이 기준입니다.</p>`}
function openNumbers(){el('numbers').innerHTML=DATA.map(q=>{let a=latest(q.question_number);return `<button class="num ${idx===q.question_number?'active':a?(a.correct?'done':'wrong'):''}" onclick="closeNumbers();moveTo(${q.question_number})">${q.question_number}</button>`}).join('');el('overlay').classList.remove('hide')}
function closeNumbers(){el('overlay').classList.add('hide')}
draw();
</script></body></html>
